- title: Projects
  type: time_table
  contents: 
    - title: <a href="https://osf.io/4ghbn/">A sociophonetic study of creaky voice across language, gender and age in Canadian English-French bilinguals</a>
      year: 2022-2025
      description: 
        - A study of creaky voice acoustic correlates across language, gender and age.
    - title: <a href="https://osf.io/f45yh/">Disentangling acoustic and social biases in creaky voice perception - The effects of f0 and face gender on creakiness ratings</a>
      year: 2024-2026
      description:
        - A study of how creaky voice perception is shaped by speaker f0 and perceived speaker gender.
    - title: <a href="https://osf.io/h968c/">Causal structure in creaky voice acoustics - Evidence for f0 mediation</a>
      year: 2024-present
      description:
        - A causal mediation analysis testing whether f0 mediates relationships between social factors and creaky voice acoustics.
    - title: <a href="https://osf.io/zj7hf/">Perceptual accessibility of Laurentian French dialect boundaries</a>
      year: 2026-present
      description:
        - A perceptual dialectology study testing whether regional distinctions between Ontario and Quebec French varieties are perceptually grounded, with an exploratory acoustic analysis of the features informing listener judgements.

